<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Flow concept C: wave clipped by a floor rail</title>
  <!-- The agent's line swings on its own; where it would fall through, the vault's rail clips it flat. -->
  <defs><clipPath id="c"><rect x="0" y="0" width="64" height="40"/></clipPath></defs>
  <rect width="64" height="64" rx="14" fill="#171e19"/>
  <path clip-path="url(#c)" d="M6 30C14 30 15 14 22 14S28 46 35 46S42 14 49 14S54 30 58 30" fill="none" stroke="#fff" stroke-width="7"/>
  <rect x="10" y="44" width="44" height="6" fill="#ffe17c"/>
</svg>
