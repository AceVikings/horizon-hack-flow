[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[profile.default.invariant]
runs = 64
depth = 32
fail_on_revert = false

[profile.demoday.invariant]
runs = 500
depth = 100

[rpc_endpoints]
hsk = "https://mainnet.hsk.xyz"

[etherscan]
hsk = { key = "verifyContract", url = "https://hsk.blockscout.com/api", chain = 177 }
